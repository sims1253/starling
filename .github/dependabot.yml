# Dependabot keeps the pinned GitHub Actions SHAs fresh (issue #10 posture):
# pullfrog/pullfrog and actions/checkout are commit-pinned for reviewability,
# which without an updater freezes pullfrog's post: cleanup step at the pinned
# revision (docs.pullfrog.com/versioning) — weekly bumps avoid both that and a
# stale checkout.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      oxlint:
        patterns:
          - oxlint
          - "@oxlint/plugins"
  - package-ecosystem: gradle
    directory: /apps/mobile
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /apps/desktop-gpui
    schedule:
      interval: weekly
    # One PR for the routine bumps; majors stay separate for review.
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
