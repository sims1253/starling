name: Android emulator

# Instrumented tests on a Pixel-profile emulator: platform wiring (recognition
# service discovery, model import, activity launch) that JVM unit tests in
# apps.yml cannot see. Slow, so it runs only when the Android app changes.
on:
  push:
    branches: [main, master]
    paths:
      - apps/mobile/**
      - .github/workflows/android-emulator.yml
  pull_request:
    paths:
      - apps/mobile/**
      - .github/workflows/android-emulator.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and test APKs
        working-directory: apps/mobile
        shell: bash
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          disable-animations: true
          working-directory: apps/mobile
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-instrumented-reports
          path: apps/mobile/app/build/reports/androidTests
          retention-days: 7
