name: Android emulator

# Instrumented tests on a Pixel-profile emulator: platform wiring (recognition
# service discovery, model import, activity launch) that JVM unit tests in
# apps.yml cannot see, followed by a UI journey with real inference and audio
# evidence. Runs when the Android app or its native dependencies change.
on:
  push:
    branches: [main, master]
    paths:
      - apps/mobile/**
      - cpp/**
      - third_party/**
      - packages/contracts/**
      - tests/fixtures/**
      - CMakeLists.txt
      - CMakePresets.json
      - scripts/apply_ggml_patches.sh
      # The Licenses screen's notices (app/build.gradle.kts) and its test.
      - licenses/**
      - LICENSE
      - apps/desktop-gpui/crates/app/assets/fonts/*.txt
      - .github/workflows/android-emulator.yml
  pull_request:
    paths:
      - apps/mobile/**
      - cpp/**
      - third_party/**
      - packages/contracts/**
      - tests/fixtures/**
      - CMakeLists.txt
      - CMakePresets.json
      - scripts/apply_ggml_patches.sh
      # The Licenses screen's notices (app/build.gradle.kts) and its test.
      - licenses/**
      - LICENSE
      - apps/desktop-gpui/crates/app/assets/fonts/*.txt
      - .github/workflows/android-emulator.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Read the native dependency revision
        id: ggml
        run: echo "sha=$(git rev-parse HEAD:third_party/ggml)" >> "$GITHUB_OUTPUT"
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          # Shared with apps.yml. ccache also hashes the compiler, ABI and
          # flags for each object, so both Android ABIs remain covered.
          key: android-ndk28.2.13676358-cmake3.31.1-${{ steps.ggml.outputs.sha }}-${{ hashFiles('third_party/ggml-patches/**', 'apps/mobile/app/build.gradle.kts') }}
          restore-keys: android-ndk28.2.13676358-cmake3.31.1
          max-size: 1G
          save: ${{ github.event_name == 'push' }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.8.0
          cache: npm
          cache-dependency-path: apps/mobile/e2e/package-lock.json
      - name: Install audio evidence tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install acceptance test dependencies
        working-directory: apps/mobile/e2e
        env:
          E2E_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run check
          npm run test:verifier
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and test APKs
        working-directory: apps/mobile
        shell: bash
        run: ./gradlew --no-daemon -PstarlingCompilerLauncher=ccache assembleDebug assembleDebugAndroidTest
      - name: Run instrumented and acceptance tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          disable-animations: true
          working-directory: apps/mobile
          script: |
            ./gradlew --no-daemon -PstarlingCompilerLauncher=ccache connectedDebugAndroidTest
            cd e2e && npm test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-instrumented-reports
          path: apps/mobile/app/build/reports/androidTests
          retention-days: 7
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-acceptance-evidence
          path: apps/mobile/e2e/artifacts
          retention-days: 7
