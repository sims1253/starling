name: desktop-gpui Rust

on:
  push:
    branches: [master, main, gpui-port, "gpui/fixes-*"]
  pull_request:
    # The desktop crates plus what their tests read from outside the
    # workspace: the contract fixture's native sources (cpp/, ggml and its
    # patches), the shared contracts and the test WAV.
    paths:
      - 'apps/desktop-gpui/**'
      - 'packages/contracts/**'
      - 'tests/fixtures/**'
      - 'cpp/**'
      - 'backends/native/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'scripts/apply_ggml_patches.sh'
      - '.github/workflows/desktop-gpui-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-gpui-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # ggml, for the contract fixture below.
          submodules: recursive
      - name: Install system libs for cpal and gpui's X11/Wayland link
        # dbus-daemon: the GlobalShortcuts portal tests (#221) run the
        # worker against a scripted portal on a private bus, and skip
        # without one.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            dbus-daemon
      - name: Install the pinned toolchain
        # The bare install reads apps/desktop-gpui/rust-toolchain.toml.
        working-directory: apps/desktop-gpui
        run: rustup toolchain install
      # Swatinem/rust-cache v2.9.2. Only master saves; PRs restore its cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop-gpui
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build the engine contract fixture
        # The engine lifecycle tests (crates/dictation/tests/engine_*.rs)
        # drive real sidecars through this deterministic server; the same
        # target apps.yml builds for the Python contract tests.
        run: |
          cmake --preset native-cpu
          cmake --build build/native-cpu --target starling-serve-contract-fixture -j2
      - name: Test the desktop-gpui workspace
        working-directory: apps/desktop-gpui
        env:
          STARLING_CONTRACT_BIN: ${{ github.workspace }}/build/native-cpu/starling-serve-contract-fixture
          # A missing fixture fails the lifecycle tests instead of letting
          # them skip and pass vacuously.
          STARLING_REQUIRE_CONTRACT_FIXTURE: "1"
        run: cargo test --workspace

  # The service host's Windows named-pipe transport and the storage-v2
  # lease's Windows lock are cfg(windows) — the ubuntu job never compiles
  # them. Run them for real on a native MSVC runner: the host's portable
  # suites (IPC conformance, limits, renderer-kill, ownership with the
  # real binary, adapters) over the named pipe, and the storage-v2
  # lease/ownership tests over LockFileEx (#220 — their first Windows
  # run found heap corruption, a pipe I/O deadlock and a lease any
  # second host could break, none visible to `cargo check`). The
  # engine suite's fixture-backed tests drive the real starling-serve
  # contract fixture, built here with MSVC like the ubuntu job builds
  # it with gcc.
  windows-test:
    name: cargo test starling-runtime-host (windows)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # ggml, for the contract fixture below.
          submodules: recursive
      - name: Install the pinned toolchain
        # The bare install reads apps/desktop-gpui/rust-toolchain.toml.
        working-directory: apps/desktop-gpui
        run: rustup toolchain install
      # Swatinem/rust-cache v2.9.2. Only master saves; PRs restore its cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop-gpui
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # One command per step: PowerShell only reports the last native
      # command's exit code, so a combined script could mask a failure.
      # The runner's default generator is Visual Studio (multi-config),
      # so the fixture lands in the Release\ subdirectory.
      - name: Configure the engine contract fixture
        run: cmake -S . -B build/native-cpu -A x64
      - name: Build the engine contract fixture
        run: cmake --build build/native-cpu --config Release --target starling-serve-contract-fixture
      - name: Test the host crate over the named pipe
        working-directory: apps/desktop-gpui
        env:
          STARLING_CONTRACT_BIN: ${{ github.workspace }}\build\native-cpu\Release\starling-serve-contract-fixture.exe
          # A missing fixture fails the engine tests instead of letting
          # them skip and pass vacuously.
          STARLING_REQUIRE_CONTRACT_FIXTURE: "1"
        run: cargo test -p starling-runtime-host
      - name: Test the storage-v2 lease
        working-directory: apps/desktop-gpui
        run: cargo test -p starling-dictation --lib store_v2
      # The insertion crate's Windows backend is cfg(windows) only.
      - name: Check the insertion crate
        working-directory: apps/desktop-gpui
        run: cargo check -p starling-insertion --all-targets
      # The app's Windows build is otherwise packaged only on master (by the
      # experimental release), so pull requests compile it here.
      - name: Check the app
        working-directory: apps/desktop-gpui
        run: cargo check -p starling-gpui

  # The app's macOS cfg paths on every run; the universal DMG below is too
  # slow (~15 min) for every PR push.
  check-macos:
    name: cargo check starling-gpui (macos, aarch64)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        # The bare install reads apps/desktop-gpui/rust-toolchain.toml.
        working-directory: apps/desktop-gpui
        run: rustup toolchain install
      # Swatinem/rust-cache v2.9.2. Only master saves; PRs restore its cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop-gpui
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Check the app
        working-directory: apps/desktop-gpui
        run: cargo check -p starling-gpui

  # Packaged desktop lanes: the universal macOS bundle (DMG) and the portable
  # Windows archive. Unsigned — artifacts are development builds for testing,
  # not notarized releases. Neither runs on pull requests (check-macos and
  # windows-test compile the app there); dispatch the workflow on a branch
  # for an installable build of it.
  build-macos:
    name: package starling-gpui (macos, universal)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        # The bare install reads apps/desktop-gpui/rust-toolchain.toml;
        # package-macos.sh adds both targets to it.
        working-directory: apps/desktop-gpui
        run: rustup toolchain install
      # Swatinem/rust-cache v2.9.2.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop-gpui
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build the universal binary and assemble Starling.app + DMG
        working-directory: apps/desktop-gpui
        run: scripts/package-macos.sh
      - name: Upload the macOS disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: starling-gpui-macos-universal-dmg
          path: apps/desktop-gpui/target/package/Starling-macOS-universal.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows:
    # master gets this same package from the experimental release workflow.
    if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master'
    uses: ./.github/workflows/package-desktop.yml
    with:
      platforms: '["windows"]'
