name: desktop-gpui Rust

on:
  push:
    branches: [master, main, gpui-port, "gpui/fixes-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-gpui-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install system libs for cpal and gpui's X11/Wayland link
        if: ${{ hashFiles('apps/desktop-gpui/Cargo.toml') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      - name: Install stable toolchain
        if: ${{ hashFiles('apps/desktop-gpui/Cargo.toml') != '' }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check and test the desktop-gpui workspace
        if: ${{ hashFiles('apps/desktop-gpui/Cargo.toml') != '' }}
        working-directory: apps/desktop-gpui
        run: |
          cargo check --workspace
          cargo test --workspace

  # The service host's Windows named-pipe transport is cfg(windows) — the
  # ubuntu job never compiles it. Keep that path compile-verified on a
  # native MSVC toolchain so the DACL/FFI surface cannot rot silently
  # (runtime coverage on Windows remains a recorded gap; see
  # crates/host/src/platform/windows.rs).
  windows-check:
    name: cargo check starling-runtime-host (windows)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the host crate
        if: ${{ hashFiles('apps/desktop-gpui/Cargo.toml') != '' }}
        working-directory: apps/desktop-gpui
        run: cargo check -p starling-runtime-host
