name: tests

# CPU-only Python checks around the native engine; model/GPU checks run
# separately (ci-starling-serve.yml).

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    # Python, benchmark and engine sources plus what the guards read: docs
    # (manifest and runtime-contract agreement), scripts and the workflows
    # the release contract checks. App-only changes skip this workflow.
    paths:
      - 'tests/**'
      - 'benchmarks/**'
      - 'scripts/**'
      - 'docs/**'
      - 'quants/**'
      - 'packages/**'
      - 'tools/**'
      - 'apps/desktop-gpui/crates/dictation/src/client.rs'
      - 'cpp/**'
      - 'backends/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'

permissions:
  contents: read

# Superseded PR pushes cancel; every master push runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # benchmarks/experiments (issue #168): the shared experiment record +
  # comparison command. Stdlib-only unit/comparator tests over the stub
  # double, plus the one-command paired CPU reproduction against the real
  # contract-fixture binary (deterministic engine double, no models).
  experiments-harness:
    name: Experiments harness (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Unit and comparator tests (stub double, no models)
        run: uv run --no-project --python 3.12 python -m unittest discover -s benchmarks/experiments -p 'test_*.py'
      - name: Paired CPU reproduction (contract fixture binary)
        run: >
          cmake -B build-exp -DSTARLING_SERVE=ON -DSTARLING_GGML_TESTS=ON
          -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_LLAMAFILE=OFF &&
          cmake --build build-exp -j --target starling-serve-contract-fixture &&
          uv run --no-project --python 3.12 python
          benchmarks/experiments/run_experiment.py demo
          --binary build-exp/starling-serve-contract-fixture
          --out-dir build-exp/experiments/demo

  # The whole Python suite on the locked starling-tools dev group. Without a
  # native build, models, or goldens the engine parity gates skip and report
  # UNAVAILABLE coverage; what runs is the parity contract (manifest schema,
  # test selection, docs agreement, comparator negative tests), the
  # capabilities/personalization/multilingual contract checks, the ggml patch
  # and release-runtime guards, and the quantization tooling unit tests.
  python-tests:
    name: Python tests (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: pytest
        run: uv run --locked --python 3.12 pytest tests -q
      - name: ruff
        run: uvx ruff@0.17.0 check .
