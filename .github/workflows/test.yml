name: tests

# CPU regressions run on Linux and Windows; model/GPU checks run separately.

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar-tests:
    name: SONAR harness (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - name: Install isolated CPU dependencies
        run: uv sync --locked --project benchmarks/sonar --python 3.12
      - name: Harness regressions
        run: uv run --project benchmarks/sonar python -m unittest discover -s benchmarks/sonar -p 'test_*.py'

  # benchmarks/experiments (issue #168): the shared experiment record +
  # comparison command. Comparator negatives, verdict semantics, determinism,
  # and runner mechanics run against the stub double; the real-binary
  # reproduction is the documented demo command (benchmarks/experiments/
  # README.md) — this job also executes it against the contract fixture to
  # prove the paired loop end to end on every PR.
  experiments-harness:
    name: Experiments harness (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - name: Experiments regressions + demo (stub-free, contract fixture)
        run: |
          uv run --no-project --python 3.12 python -m unittest discover \
            -s benchmarks/experiments -p 'test_*.py'
          cmake -B build-exp -DSTARLING_SERVE=ON -DSTARLING_GGML_TESTS=ON \
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_LLAMAFILE=OFF
          cmake --build build-exp -j --target starling-serve-contract-fixture
          uv run --no-project --python 3.12 python \
            benchmarks/experiments/run_experiment.py demo \
            --binary build-exp/starling-serve-contract-fixture \
            --out-dir build-exp/experiments/demo


  # benchmarks/experiments (issue #168): the shared experiment record +
  # comparison command. Stdlib-only unit/comparator tests over the stub
  # double, plus the one-command paired CPU reproduction against the real
  # contract-fixture binary (deterministic engine double, no models).
  experiments-harness:
    name: Experiments harness (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - name: Unit and comparator tests (stub double, no models)
        run: uv run --no-project --python 3.12 python -m unittest discover -s benchmarks/experiments -p 'test_*.py'
      - name: Paired CPU reproduction (contract fixture binary)
        run: >
          cmake -B build-exp -DSTARLING_SERVE=ON -DSTARLING_GGML_TESTS=ON
          -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_LLAMAFILE=OFF &&
          cmake --build build-exp -j --target starling-serve-contract-fixture &&
          uv run --no-project --python 3.12 python
          benchmarks/experiments/run_experiment.py demo
          --binary build-exp/starling-serve-contract-fixture
          --out-dir build-exp/experiments/demo


  engine-guards:
    name: Native engine and server guards (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - name: Test portable guards without the deprecated CUDA environment
        run: >-
          uv run --no-project --python 3.12
          --with pytest --with numpy --with scipy --with fastapi --with httpx
          --with uvicorn --with websockets
          python -m pytest -q
          tests/test_ggml_patches.py tests/test_release_runtime_contract.py
          tests/test_server_routing.py tests/test_server_robustness.py
          tests/test_server_lifecycle.py tests/test_server_websocket.py
          tests/test_server_client.py tests/test_stream_chunk.py
          tests/test_native_parity_contract.py

      # tests/test_native_parity_contract.py (issue #167): the executable
      # numerical-correctness contract — manifest schema, test-selection
      # agreement, docs/manifest agreement, and the comparator negative tests
      # (seeded truncation / wrong token / wrong EOS boundary are rejected).
      # Stdlib + pytest only, no models, no downloads; the required-target
      # accounting reports gitignored-asset coverage as UNAVAILABLE (distinct,
      # non-failing) so the contract is executable on every CPU runner.

      - name: Test native Python bindings with CPU-only PyTorch
        run: >-
          uv run --no-project --python 3.12 --with pytest --with numpy --with torch
          --index https://download.pytorch.org/whl/cpu
          python -m pytest -q tests/test_benchmark_ggml_adapters.py

      - name: Test ark06/voxtral Python pipelines with CPU-only PyTorch
        run: >-
          uv run --no-project --python 3.12 --with pytest --with numpy --with soundfile
          --with torch --index https://download.pytorch.org/whl/cpu
          python -m pytest -q tests/test_ark06_pipeline.py tests/test_voxtral_pipeline.py
        env:
          PYTHONPATH: src

  cpu-tests:
    # Deprecated CUDA/Python environment is opt-in; portable CI lives in apps.yml.
    if: github.event_name == 'workflow_dispatch'
    name: CPU tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv v10.0.1
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        # `uv sync --locked --extra dev` resolves from the project. triton is marked
        # `sys_platform == 'linux'` in pyproject.toml, so it is NOT installed
        # on windows-latest (no official Windows wheel) and the kernel package
        # auto-selects the torch backend there instead.
        run: uv sync --locked --extra dev

      - name: CPU-safe server tests
        # No CUDA, no model loading, no network: verifies slug->backend
        # routing, CLI arg parsing, config plumbing, cancellation/error
        # paths, and the CPU-only robustness/lifecycle regressions.
        # test_s1_config.py: pure-Python s1 prompt-contract tests (control
        # line, chunking, budget formula) — no model, no goldens.
        run: >-
          uv run python -m pytest -q
          tests/test_server_routing.py tests/test_server_robustness.py
          tests/test_server_lifecycle.py tests/test_server_websocket.py
          tests/test_server_client.py tests/test_stream_chunk.py
          tests/test_s1_config.py tests/test_autotune.py tests/test_flags.py
          tests/test_fp4_quantization.py tests/test_ablation_checks.py
          tests/test_multistep_controller.py
          tests/test_kernel_selection.py tests/test_gpu_runner.py
          tests/test_benchmark_ggml_adapters.py tests/test_quantization_drivers.py
          tests/test_ggml_patches.py tests/test_release_runtime_contract.py

      - name: POSIX GPU lock lifecycle tests
        if: runner.os == 'Linux'
        run: uv run python -m pytest tests/test_gpu_session.py tests/test_gpu_lock.py -q

      - name: Kernel backend import smoke
        run: uv run python -c "import starling._kernels as K; print('backend:', K.get_backend_name(), 'triton:', K.have_triton())"
