name: tests

# CPU-safe cross-platform CI.
#
# Starling's heavy GPU work (model byte-exactness, benchmarks, CUDA-graph
# capture) needs an RTX 5090 / sm_120 and stays out of CI -- it is run manually
# on the benchmark box. This workflow runs ONLY the CPU-safe subset:
#
#   * tests/test_server_routing.py -- pure, GPU-free slug->backend routing,
#     CLI parsing, config plumbing (no model loaded, no CUDA).
#   * tests/test_server_robustness.py -- CPU-only regressions for the
#     robustness fixes (fakes; no GPU, no model, no network).
#   * an import smoke test of starling._kernels, proving the backend dispatch
#     resolves correctly on each OS (triton on Linux, torch on Windows).
#
# The matrix runs both Linux and Windows to guard the kernel-backend
# abstraction that landed with cross-platform support (src/starling/_kernels/).

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv v10.0.1
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        # `uv sync --extra dev` resolves from the project. triton is marked
        # `sys_platform == 'linux'` in pyproject.toml, so it is NOT installed
        # on windows-latest (no official Windows wheel) and the kernel package
        # auto-selects the torch backend there instead.
        run: uv sync --extra dev

      - name: CPU-safe server tests
        # No CUDA, no model loading, no network: verifies slug->backend
        # routing, CLI arg parsing, config plumbing, cancellation/error
        # paths, and the CPU-only robustness/lifecycle regressions.
        # test_s1_config.py: pure-Python s1 prompt-contract tests (control
        # line, chunking, budget formula) — no model, no goldens.
        run: >-
          uv run python -m pytest -q
          tests/test_server_routing.py tests/test_server_robustness.py
          tests/test_server_lifecycle.py tests/test_stream_chunk.py
          tests/test_s1_config.py tests/test_autotune.py tests/test_flags.py
          tests/test_fp4_quantization.py
          tests/test_benchmark_ggml_adapters.py tests/test_quantization_drivers.py
          tests/test_ggml_patches.py

      - name: POSIX GPU lock lifecycle tests
        if: runner.os == 'Linux'
        run: uv run python -m pytest tests/test_gpu_session.py tests/test_gpu_lock.py -q

      - name: Import smoke (kernel backend dispatches per-OS)
        # Only call have_triton() + get_backend_name() (NOT get_backend()) --
        # both are pure (no backend import, no torch import) and safe on a
        # CUDA-less runner. Expected output:
        #   ubuntu : backend: triton  triton: True
        #   windows: backend: torch   triton: False
        run: uv run python -c "import starling._kernels as K; print('backend:', K.get_backend_name(), 'triton:', K.have_triton())"
