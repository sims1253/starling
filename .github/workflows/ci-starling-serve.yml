# CI: build starling-serve (CPU smoke build) on every PR / push.
#
# This verifies the native serving layer compiles and --version / --abi-version
# work. Full GPU builds (CUDA/Vulkan/Metal) are verified in the release workflow.
#
# The `e2e-real-model` job runs the full HTTP/WS integration suite (real
# transcription round trips) against the CPU build. It is GATED (off by
# default) — see the comment block on that job for why.

name: CI starling-serve

on:
  push:
    branches: [master]
    paths:
      - 'cpp/**'
      - 'CMakeLists.txt'
      - 'third_party/**'
      - 'scripts/apply_ggml_patches.sh'
      - 'tests/test_native_serve.py'
      - 'tests/test_compact_quantization.py'
      - 'benchmarks/recipes/**'
      - '.github/workflows/ci-starling-serve.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'CMakeLists.txt'
      - 'third_party/**'
      - 'scripts/apply_ggml_patches.sh'
      - 'tests/test_native_serve.py'
      - 'tests/test_compact_quantization.py'
      - 'benchmarks/recipes/**'
      - '.github/workflows/ci-starling-serve.yml'
  workflow_dispatch:
    inputs:
      run-e2e-real-model:
        description: 'Run the real-model E2E suite (downloads a GGUF)'
        type: boolean
        default: false

jobs:
  build-cpu:
    runs-on: ubuntu-22.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build (CPU)
        run: |
          cmake -B build -DSTARLING_SERVE=ON -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_LLAMAFILE=OFF
          cmake --build build -j --target starling-serve stream_session_test \
            audio_parser_test loader_guard_test higgs_dtype_guard_test \
            audex_loader_guard_test model_lifetime_test starling-quantize \
            parakeet_compact_engine_test

      - name: Quantizer storage and recipe regressions
        env:
          STARLING_QUANTIZE_BIN: ${{ github.workspace }}/build/starling-quantize
        run: |
          pip install --quiet "numpy==2.2.6" "gguf==0.19.0" "pytest==8.4.2"
          python -m pytest tests/test_compact_quantization.py -q

      - name: C++ unit tests (serve logic, no GPU/model)
        run: |
          ./build/stream_session_test
          ./build/audio_parser_test

      # loader_guard_test SKIPs cleanly when the gitignored GGUFs are absent;
      # higgs_dtype_guard_test and audex_loader_guard_test synthesize their
      # own GGUFs and always run (audex's real-file smoke SKIPs when absent).
      - name: C++ loader/dtype guard tests
        run: |
          ./build/loader_guard_test
          ./build/higgs_dtype_guard_test
          ./build/audex_loader_guard_test
          ./build/model_lifetime_test

      - name: Quantized Parakeet prediction and joint CPU regression
        run: ./build/parakeet_compact_engine_test

      - name: Model lifetime and quantized decoding sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
          STARLING_GGML_DEVICE: cpu
        run: |
          cmake -S . -B build-sanitized -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF -DGGML_LLAMAFILE=OFF -DGGML_OPENMP=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
          cmake --build build-sanitized -j2 --target model_lifetime_test parakeet_compact_engine_test
          ./build-sanitized/model_lifetime_test
          ./build-sanitized/parakeet_compact_engine_test

      - name: Smoke test --version
        run: |
          ./build/starling-serve --version
          ./build/starling-serve --abi-version

      - name: Smoke test --help
        run: ./build/starling-serve --help

      - name: Smoke test HTTP /health
        run: |
          ./build/starling-serve --model parakeet --gguf /dev/null \
            --port 18181 --no-eager-load &
          sleep 1
          curl -sf http://127.0.0.1:18181/health | grep -q '"model":"parakeet"'
          kill %1 2>/dev/null || true

      - name: Transport-contract integration tests (placeholder model)
        # Full HTTP/WS contract suite without a real model: health, errors,
        # multipart WAV parsing, the WAV frame-count bounds, the WS stream
        # cap, and request/response shapes.
        run: |
          # Pinned, py3.10-compatible (the ubuntu-22.04 system python):
          # exact versions keep the suite reproducible.
          pip install --quiet "requests==2.32.5" "numpy==2.2.6" "websockets==15.0.1"
          python tests/test_native_serve.py --binary "$PWD/build/starling-serve"

  # ---------------------------------------------------------------------------
  # Real-model E2E — GATED, OFF BY DEFAULT.
  #
  # This job downloads the smallest real GGUF (parakeet-tdt-0.6b-v3 q8_0) and
  # runs the full suite incl. true transcription round trips (issue #22).
  # A 1–2 s clip on a 0.6B q8_0 CPU decode is a correctness test, not a perf
  # test — the CPU-safe-CI constraint is respected.
  #
  # Run explicitly with workflow_dispatch. The published Parakeet Q8 fixture
  # is pinned below; normal PRs exercise the placeholder-model transport
  # contract without downloading model weights.
  # ---------------------------------------------------------------------------
  e2e-real-model:
    needs: build-cpu
    if: github.event_name == 'workflow_dispatch' && inputs.run-e2e-real-model
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      HF_REPO: scholzmx/parakeet-tdt-0.6b-v3-gguf
      GGUF_FILE: parakeet-tdt-0.6b-v3-q8_0.gguf
      GGUF_REV: 96402b32bd374742aa1da3c66af30aa64cea3fdb
      # Pinned sample clip (11.3 s, 16 kHz mono PCM16) + its expected
      # parakeet-tdt transcript (captured with tdt-0.6b-v3-q8_0).
      AUDIO_URL: https://raw.githubusercontent.com/ggml-org/whisper.cpp/1fe009caeda75f69bc864d6370b10674e45a92bd/samples/jfk.wav
      EXPECTED_TEXT: "And so, my fellow Americans, ask not what your country can do for you, ask what you can do for your country."
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build (CPU)
        run: |
          cmake -B build -DSTARLING_SERVE=ON -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_LLAMAFILE=OFF
          cmake --build build -j --target starling-serve

      # actions/cache v6.1.0 — keyed on the pinned GGUF revision so a pinned
      # model never re-downloads and a revision bump invalidates the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: model.gguf
          key: starling-serve-e2e-${{ env.HF_REPO }}-${{ env.GGUF_FILE }}-${{ env.GGUF_REV }}

      - name: Download GGUF (if not cached)
        run: |
          if [ -f model.gguf ]; then echo "cached"; exit 0; fi
          curl -fL --retry 3 -o model.gguf \
            "https://huggingface.co/${HF_REPO}/resolve/${GGUF_REV}/${GGUF_FILE}"

      - name: Download test clip
        run: curl -fL --retry 3 -o clip.wav "$AUDIO_URL"

      - name: Real-model integration suite
        run: |
          # Pinned, py3.10-compatible (the ubuntu-22.04 system python):
          # exact versions keep the suite reproducible.
          pip install --quiet "requests==2.32.5" "numpy==2.2.6" "websockets==15.0.1"
          python tests/test_native_serve.py --binary "$PWD/build/starling-serve" \
            --gguf "$PWD/model.gguf" --audio "$PWD/clip.wav" \
            --expected-text "$EXPECTED_TEXT"
