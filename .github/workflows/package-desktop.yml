name: Package desktop apps

on:
  workflow_call:
    inputs:
      platforms:
        description: JSON array of linux and/or windows
        type: string
        default: '["linux", "windows"]'
      source-ref:
        type: string
        default: ''
      retention-days:
        type: number
        default: 14
      # Runs the workspace tests on the Linux leg only.
      run-tests:
        type: boolean
        default: true
      # Bundle the CPU and Vulkan starling-serve engines inside the desktop
      # archive (the app launches one as a supervised sidecar, #362). Requires
      # the starling-serve server artifacts from the same workflow run.
      bundle-engines:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    # Single source of truth for the engines bundled into the desktop archive,
    # in preference order (the app tries the first entry first). Checked for
    # agreement by scripts/release-runtime/check-contract.py.
    env:
      BUNDLED_ENGINES: "vulkan cpu"
      BUNDLE_ENGINES: ${{ inputs.bundle-engines }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            linux|windows) ;;
            *) echo "::error::Unsupported desktop platform: $PLATFORM"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Install Linux libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan1 libfontconfig1-dev
      - name: Ensure the stable toolchain
        id: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "version=$(rustc --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop-gpui/target
          key: desktop-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('apps/desktop-gpui/Cargo.lock') }}
      - name: Test the workspace
        if: matrix.platform == 'linux' && inputs.run-tests
        working-directory: apps/desktop-gpui
        run: cargo test --locked --workspace
      - name: Build the app
        working-directory: apps/desktop-gpui
        run: cargo build --locked --release -p starling-gpui
      - name: Download the Vulkan engine artifact
        if: inputs.bundle-engines
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: starling-serve-${{ matrix.platform }}-vulkan
          path: engines-artifacts
      - name: Download the CPU engine artifact
        if: inputs.bundle-engines
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: starling-serve-${{ matrix.platform }}-cpu
          path: engines-artifacts
      - name: Install the Vulkan loader (Windows)
        # The Windows Vulkan engine links vulkan-1.dll, which the hosted
        # runner lacks; the assembly step runs its --version. Same pinned
        # action and SDK as release-starling-serve.yml.
        if: inputs.bundle-engines && matrix.platform == 'windows'
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.357.0
          cache: true
      - name: Assemble the bundled engines
        if: inputs.bundle-engines
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # Extracts each server artifact, verifies its checksum, runs
          # --version/--abi-version on every engine (requiring agreement),
          # and writes engines.json + SHA256SUMS.txt + RUNTIME.md.
          python=python3
          command -v python3 >/dev/null 2>&1 || python=python
          "$python" scripts/experimental-release/bundle-engines.py \
            --platform "$PLATFORM" --artifacts engines-artifacts \
            --out dist/engines --backends "$BUNDLED_ENGINES"
      - name: Check bundled engine dependencies (Linux)
        if: inputs.bundle-engines && matrix.platform == 'linux'
        run: |
          # libvulkan1 is installed above, so both engines must resolve every
          # loader dependency on the runner.
          for backend in $BUNDLED_ENGINES; do
            report="$RUNNER_TEMP/ldd-starling-serve-$backend.txt"
            ldd "dist/engines/starling-serve-$backend" | tee "$report"
            if grep -q 'not found' "$report"; then
              echo "::error::starling-serve-$backend has unresolved shared libraries"
              exit 1
            fi
          done
      - name: Package Linux app
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          ldd apps/desktop-gpui/target/release/starling-gpui > "$RUNNER_TEMP/desktop-libraries.txt"
          cat "$RUNNER_TEMP/desktop-libraries.txt"
          if grep -q 'not found' "$RUNNER_TEMP/desktop-libraries.txt"; then
            echo '::error::Desktop app has unresolved shared libraries'
            exit 1
          fi
          strip apps/desktop-gpui/target/release/starling-gpui
          cp apps/desktop-gpui/target/release/starling-gpui dist/
          cp docs/experimental-releases.md dist/README.md
          git rev-parse HEAD > dist/COMMIT.txt
          contents=(starling-gpui README.md COMMIT.txt)
          if [ "$BUNDLE_ENGINES" = "true" ]; then contents+=(engines); fi
          tar -C dist -czf starling-gpui-linux-x64.tar.gz "${contents[@]}"
      - name: Package Windows app
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item apps/desktop-gpui/target/release/starling-gpui.exe dist/
          Copy-Item docs/experimental-releases.md dist/README.md
          git rev-parse HEAD | Set-Content dist/COMMIT.txt
          Compress-Archive -Path dist/* -DestinationPath starling-gpui-windows-x64.zip
      - name: Upload desktop archive
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: starling-gpui-${{ matrix.platform }}-x64
          path: starling-gpui-${{ matrix.platform }}-x64.*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
