# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        # actions/checkout v7.0.1 (pinned per issue #10; pullfrog/pullfrog
        # itself is referenced by the vendor-documented @v0 moving tag).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run agent
        # pullfrog/pullfrog v0 (c4d0ca6f15d12382ddd20d2010bc596b405f42f0).
        # Pinned to a reviewed commit per issue #10: the action runs with
        # id-token: write and provider secrets, and the moving v0 tag could
        # be retargeted. NOTE the ref only pins this thin wrapper (action.yml
        # contract + the post: cleanup step) — the agent itself is pulled
        # from npm at runtime regardless. A SHA pin WITHOUT an updater is the
        # one combination pullfrog's docs say to avoid (the cleanup step
        # freezes; a future incompatible cleanup hook fails every run after
        # the agent finished), so .github/dependabot.yml keeps this SHA and
        # the checkout pin below fresh (weekly github-actions bumps).
        uses: pullfrog/pullfrog@7ba9425d187df30638b003d6cee67f3d36023243
        with:
          prompt: ${{ inputs.prompt }}
        env:
          # add at least one provider API key
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY:
            ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          
          # for Amazon Bedrock (https://docs.pullfrog.com/bedrock)
          # AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS_REGION: us-east-1
          # BEDROCK_MODEL_ID: <bedrock-model-id>
          
          # for Google Vertex AI (https://docs.pullfrog.com/vertex)
          # VERTEX_SERVICE_ACCOUNT_JSON: >-
          #   ${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON }}
          # GOOGLE_CLOUD_PROJECT: my-project
          # VERTEX_LOCATION: global
          # VERTEX_MODEL_ID: <vertex-model-id>

          # for Azure OpenAI (https://docs.pullfrog.com/azure)
          # AZURE_RESOURCE_NAME is the <name> in https://<name>.openai.azure.com,
          # AZURE_DEPLOYMENT is your deployment's name, not the model it serves
          # AZURE_RESOURCE_NAME: my-resource
          # AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          # AZURE_DEPLOYMENT: <deployment-name>
          # both limits are required — set them to the real limits of that model
          # AZURE_CONTEXT: "400000"
          # AZURE_MAX_OUTPUT: "128000"

          # for any OpenAI-compatible endpoint — LiteLLM, Cloudflare AI Gateway,
          # self-hosted vLLM (https://docs.pullfrog.com/openai-compatible)
          # OPENAI_COMPATIBLE_BASE_URL: https://litellm.example.com/v1
          # OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          # OPENAI_COMPATIBLE_MODEL: <model-id>
          # both limits are required — set them to the real limits of that model
          # OPENAI_COMPATIBLE_CONTEXT: "128000"
          # OPENAI_COMPATIBLE_MAX_OUTPUT: "16384"
