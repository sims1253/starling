name: Portable apps and contracts

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR pushes cancel; every master push runs to completion.
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which lanes a pull request touches; pushes and dispatches run them all.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      # dorny/paths-filter v4.0.3. On pull requests it lists the changed
      # files through the API, so no checkout is needed.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            native: &native
              - 'cpp/**'
              - 'backends/native/**'
              - 'third_party/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'scripts/apply_ggml_patches.sh'
              - '.github/workflows/apps.yml'
            contracts:
              - *native
              - 'backends/**'
              - 'quants/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'pyproject.toml'
              - 'uv.lock'
            android:
              - *native
              - 'apps/mobile/**'
              - 'packages/contracts/**'
              - 'tests/fixtures/**'
            ios:
              - 'apps/ios/**'
              - '.github/workflows/apps.yml'

  typescript:
    name: TypeScript workspace (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 24
          cache: true
          run-install: true
      - run: vp run check

  api-contracts:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 24
          cache: true
          run-install: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Fail on pnpm lockfile drift
        # E16 gate: a manifest edit without a regenerated pnpm-lock.yaml
        # fails here (ERR_PNPM_OUTDATED_LOCKFILE) instead of re-resolving.
        # Plain --frozen-lockfile only; --dry-run re-resolves and exits 0.
        run: pnpm install --frozen-lockfile
      - name: Fail on uv lockfile drift
        # Root pyproject.toml gate (E16). quants is gated by --locked below;
        # benchmarks/sonar by test.yml. No PR gate existed for the root lock.
        run: uv lock --check
      - name: Build real HTTP handlers with a deterministic test engine
        run: |
          cmake --preset native-cpu
          cmake --build build/native-cpu --target starling-serve-contract-fixture -j2
      - run: python -m unittest discover -s backends/native/tests -v
      - run: python -m unittest discover -s quants/tests -v
      - run: uv run --project quants --locked starling-quants check
      - name: Validate OpenAPI
        run: uv run --no-project --with openapi-spec-validator python -c "import json; from openapi_spec_validator import validate; validate(json.load(open('packages/contracts/openapi.json')))"

  android:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build and test Android
        working-directory: apps/mobile
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Check experimental release branding
        # The experimental release overlays the user-visible names; this
        # guards the overlay against colliding with src/main resources.
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PstarlingExperimental=true :app:mergeReleaseResources
          merged=$(find app/build/intermediates -path '*mergeReleaseResources*merged.dir*' -name values.xml)
          if [ "$(printf '%s\n' "$merged" | grep -c .)" != 1 ]; then
            echo "::error::Expected one merged release values.xml, found: $merged"
            exit 1
          fi
          grep -q '<string name="app_name">Starling Experimental</string>' "$merged"
          grep -q '<string name="screen_title">Starling Experimental</string>' "$merged"
          grep -q '<string name="keyboard_name">Starling Experimental Voice Input</string>' "$merged"
          grep -q '<string name="recognition_service_name">Starling Experimental Voice Recognition</string>' "$merged"
      - name: Upload the debug APK
        # Installable build of every push and same-repository PR for
        # on-device testing; fork PRs (unreviewed code) get no installable
        # artifact. Debug builds are signed with the runner's ephemeral debug
        # key, so switching between artifacts needs an uninstall first.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: starling-mobile-debug-apk
          path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test portable Swift core
        working-directory: apps/ios
        run: swift test
      - name: Generate Xcode project
        working-directory: apps/ios
        run: brew install xcodegen && xcodegen generate
      - name: Build for iOS Simulator
        working-directory: apps/ios
        run: xcodebuild -project StarlingVoice.xcodeproj -scheme StarlingVoice -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
