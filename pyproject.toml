[project]
name = "starling"
version = "0.1.0"
description = "Hand-tuned Triton megakernels for fast on-device ASR (granite-speech-4.1-2b + parakeet-tdt/unified + moss + qwen3 + cohere + higgs) on modern NVIDIA GPUs"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.11",
    "torchaudio>=2.11",
    # Triton ships no official Windows wheels (experimental at best).  Mark it
    # Linux-only so `pip install` / `uv sync` succeeds on Windows; the
    # `starling._kernels` package then auto-selects the torch backend.  See
    # src/starling/_kernels/__init__.py.
    "triton>=3.6 ; sys_platform == 'linux'",
    "transformers>=5.14.1",
    "accelerate",
    "numpy",
    "scipy",
    "soundfile",
    "librosa",
    "einops",
    "einx",
    "matplotlib",
    "tabulate",
    "jiwer",
    "kaldialign>=0.12.0",
    "whisper-normalizer>=0.1.12",
    "datasets>=5.0.0",
    "torchcodec>=0.14.0",
    "huggingface-hub>=1.0.0",
    "sentencepiece>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "requests",
    "websockets",
    # The server prefers the FastAPI transport when importable; the CPU-only
    # server tests exercise its routes (stdlib fallback runs unconditionally),
    # so the dev/CI env carries both.
    "fastapi",
    "uvicorn",
]

[project.scripts]
starling-gpu-run = "starling.gpu.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starling"]

# ---- uv configuration ----
[tool.uv]
# This machine is WSL2 on a filesystem that does NOT support reflinks, which
# caused intermittent venv corruption (files silently missing after install).
# Force plain copies so installs are deterministic and `uv run` is reliable.
link-mode = "copy"

# PyTorch CUDA 13.0 (Blackwell / sm_120) wheel index.
# This is the ONLY index that ships torch builds which run on the RTX 5090;
# the default PyPI torch wheel is cu12 / sm_90 and will NOT work on Blackwell.
# `explicit = true` means this index is only used for packages that opt in
# via [tool.uv.sources], so it never shadows PyPI for other deps.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# Pin torch + torchaudio to the cu130 index so resolution never falls back to
# PyPI's cu12 wheels (which will not run on Blackwell / sm_120).
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# ---- ruff configuration ----
# Pinned so CI and local lint agree. Conservative: selects only the ruff
# default rule families (E = pycodestyle errors, F = Pyflakes) that the
# existing `# noqa` codes in this repo actually belong to. The other noqa
# codes scattered across the codebase (WPS433, BLE001, ANN001, N802, D401,
# A003) come from flake8 plugins that ruff does not enable, so they remain
# inert under ruff. No autofix is configured — CI stays check-only.
[tool.ruff]
# 100 matches actual practice: only ~62 of ~28k first-party lines exceed it
# (and none carry an explicit `# noqa: E501`). Vendored Higgs code under
# src/starling/higgs/vendor has much longer lines but is third-party and is
# expected to be excluded from lint, not to dictate the project limit.
line-length = 100
# requires-python = ">=3.10,<3.13" — target the floor so ruff never suggests
# syntax/features newer than the minimum supported Python.
target-version = "py310"

[tool.ruff.lint]
# `E501` (line length) is intentionally ignored: the project never enforced a
# line cap (zero `# noqa: E501` anywhere, and ~62 first-party lines exceed 100).
# `line-length` above documents the intended target without breaking the build
# on pre-existing code. Re-enable E501 once the long lines are cleaned up.
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# `__init__.py` modules re-export public symbols via relative imports; F401
# (imported but unused) is expected and intentional for these re-exports.
"__init__.py" = ["F401"]
# Vendored / third-party model code — not ours to edit; excluded wholesale from
# style rules. F-class (real bugs) still apply so we notice if they break.
"src/starling/higgs/vendor/**" = ["E"]
"src/starling/moss/vendor/**" = ["E"]
"src/starling/nar/vendor/**" = ["E"]
# Throwaway probe / scratch scripts under scripts/ and benchmarks/ use compact
# one-liners (`if ...: x; y`) intentionally; E701/E702 (multiple statements on
# one line) are suppressed there. F-class rules still apply.
"scripts/**" = ["E701", "E702", "E402", "E401"]
"benchmarks/**" = ["E701", "E702", "E402", "E731", "E741"]
