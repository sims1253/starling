[project]
name = "starling"
version = "0.1.0"
description = "Hand-tuned Triton megakernels for fast on-device ASR (granite-speech-4.1-2b + parakeet-tdt/unified + moss + qwen3 + cohere + higgs) on modern NVIDIA GPUs"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.11",
    "torchaudio>=2.11",
    # Triton wheels are Linux-only; other platforms use CUDA C++ or torch.
    "triton>=3.6 ; sys_platform == 'linux'",
    "transformers>=5.14.1",
    "accelerate",
    "numpy",
    "scipy",
    "soundfile",
    "librosa",
    "einops",
    "einx",
    "torchcodec>=0.14.0",
    "huggingface-hub>=1.0.0",
    "sentencepiece>=0.2.0",
]

[project.optional-dependencies]
server = ["fastapi", "uvicorn", "websockets"]
dev = [
    "pytest",
    "requests",
    "httpx",
    "starling[server]",
    # CPU quantization-driver tests import the WER scorer.
    "jiwer",
]
bench = [
    "datasets>=5.0.0",
    "jiwer",
    "kaldialign>=0.12.0",
    "matplotlib",
    "tabulate",
    "whisper-normalizer>=0.1.12",
]

[project.scripts]
starling-python-serve = "starling.server:run"
starling-gpu-run = "starling.gpu.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starling"]

# Copy installs also work on filesystems with unreliable reflink support.
[tool.uv]
link-mode = "copy"

# Use the CUDA 13.0 builds used for the benchmarks. Only torch and torchaudio
# resolve from this index; other packages use PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
# Existing code has no enforced line-length limit.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Package exports are intentional; retain bug checks in vendored code.
"__init__.py" = ["F401"]
"src/starling/higgs/vendor/**" = ["E"]
"src/starling/moss/vendor/**" = ["E"]
"src/starling/nar/vendor/**" = ["E"]
# Probes and benchmarks use compact statements and deferred imports.
"scripts/**" = ["E701", "E702", "E402", "E401"]
"benchmarks/**" = ["E701", "E702", "E402", "E731", "E741"]
