[project]
name = "starling-tools"
version = "0.0.0"
description = "Python tooling around Starling's native engine: GGUF converters, golden capture, parity and server tests, benchmark scripts"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy",
    "soundfile",
    "gguf",
]

[dependency-groups]
# GGUF converters (scripts/convert_*.py) and golden capture (scripts/goldens/).
convert = [
    "torch>=2.11",
    "transformers>=5.14.1",
    "accelerate",
    "safetensors",
    "sentencepiece>=0.2.0",
    "librosa",
    "huggingface-hub>=1.0.0",
]
# Corpus export and calibration (benchmarks/fast_engine/export_fleurs.py,
# benchmarks/fleurs_*.py, benchmarks/imatrix_collect.py).
eval = [
    "torch>=2.11",
    "torchaudio>=2.11",
    "torchcodec>=0.14.0",
    "datasets>=5.0.0",
    "pyarrow",
    "fsspec",
    "jiwer",
]
# `uv run pytest tests`: everything that needs a model or a native build skips.
dev = [
    "pytest",
    "requests",
    "websockets",
    "jiwer",
]

[tool.uv]
# Not a package: a dependency set for the scripts and tests in this repo.
package = false
# Copy installs also work on filesystems with unreliable reflink support.
link-mode = "copy"

# CPU torch builds: the tooling never needs CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
# Existing code has no enforced line-length limit.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts and benchmarks use compact statements and deferred imports.
"scripts/**" = ["E701", "E702", "E402", "E401"]
"benchmarks/**" = ["E701", "E702", "E402", "E731", "E741"]
