[package]
name = "starling-dictation"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sims1253/starling"
description = "Rust port of @starling/dictation: audio prep, transcription client, session storage, fidelity analysis, capture and playback"

[dependencies]
# `Bytes::from_owner` wraps the caller's shared recording buffer without
# copying it, so the transcription upload adds no second WAV in memory
# (issue #235). Already in the tree via reqwest/hyper.
bytes = "1"
cpal = "0.15"
dirs = "6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rodio = { version = "0.20", default-features = false, features = ["wav"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
# Drives the async reqwest client behind the blocking façade (issue #251):
# `rt` runs it on a dedicated current-thread runtime, `net`/`time` back
# `enable_all` (the connection and timeout drivers reqwest needs), `sync`
# is the `watch` channel (the cancellation broadcast), `macros` is
# `tokio::select!`.
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
