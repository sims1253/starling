[package]
name = "starling-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sims1253/starling"
description = "Starling desktop dictation app built with gpui (gpui port of the Electron shell)"

[dependencies]
gpui = "0.2.2"
global-hotkey = "0.7"
starling-dictation = { path = "../dictation" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6"
unicode-segmentation = "1"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
