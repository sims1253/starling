[package]
name = "starling-runtime-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sims1253/starling"
description = "Starling runtime service host (E17 I4, Mode B): one process per user session serving the runtime over OS-local authenticated IPC"

[dependencies]
starling-dictation = { path = "../dictation" }
starling-runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
# The live stream (#357, in the host since #220): the `/stream` WebSocket
# client, same versions as the app's.
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Store answers too large to keep in memory wait in unlinked spool files.
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Windows named-pipe transport (platform::windows). The same crate
# already reaches windows-sys through cpal on Windows builds; the features
# listed here are the pipe/ACL surface that module needs (plus the
# console-ctrl handler the binary's graceful shutdown uses). None of this
# compiles into non-Windows builds.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[features]
# Exposes `HostConfig::with_insecure_test_app_role` to this crate's own
# integration tests via the self dev-dependency below. Production builds
# never enable it.
test-support = []

[dev-dependencies]
starling-processing = { path = "../processing" }
starling-runtime = { path = "../runtime", features = ["test-doubles"] }
starling-runtime-host = { path = ".", features = ["test-support"] }
