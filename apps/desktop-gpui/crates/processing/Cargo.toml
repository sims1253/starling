[package]
name = "starling-processing"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sims1253/starling"
description = "Starling staging and processing: the staged draft, transform requests/results and the provider choice (#293), the processing pipeline and its providers (#294)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The cancellation signal the runtime's jobs already use (issue #251).
starling-dictation = { path = "../dictation" }
# Same HTTP stack and posture as the dictation client: async reqwest on a
# private runtime behind a blocking facade, rustls only.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `macros` is for tokio::select! in http.rs, not only the tests.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync"] }
url = "2"
