[package]
name = "starling-insertion"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sims1253/starling"
description = "Focus-safe text insertion (issue #221 slice 2): capture, revalidate and type into the focused external target"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xtest"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }

[dependencies]
starling-runtime = { version = "0.1.0", path = "../runtime", optional = true }

[features]
# The `DeliveryAdapter` bridge (src/runtime.rs): implements the runtime's
# delivery seam over an [`crate::Inserter`]. The I5 host (issue #220)
# enables this and wires the adapter through
# `RuntimeConfig::with_delivery_adapter`; the insertion core itself never
# touches the runtime, so embedders that only capture/type (a CLI probe,
# phase B experiments) can leave it off.
runtime = ["dep:starling-runtime"]
# Exposes `starling_insertion::testing` (the scripted fake backend) to
# this crate's own tests via the self dev-dependency below — the same
# pattern starling-runtime uses for its test doubles. Production builds
# never enable it.
test-doubles = []

[dev-dependencies]
starling-insertion = { path = ".", features = ["test-doubles", "runtime"] }
starling-runtime = { path = "../runtime" }
