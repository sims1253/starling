[package]
name = "starling-insertion"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sims1253/starling"
description = "Focus-safe text insertion: capture, revalidate and type into the focused external window"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xkb", "xtest"] }
wayland-client = "0.31.15"
wayland-scanner = "0.31.11"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }

[dependencies]
log = "0.4.34"
starling-runtime = { version = "0.1.0", path = "../runtime", optional = true }

[features]
# The `DeliveryAdapter` bridge (src/runtime.rs).
runtime = ["dep:starling-runtime"]
# Exposes `starling_insertion::testing` and test-only constructors to this
# crate's own tests via the self dev-dependency below.
test-doubles = []

[dev-dependencies]
starling-insertion = { path = ".", features = ["test-doubles", "runtime"] }
starling-runtime = { path = "../runtime" }
