<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171813" />
    <!-- connect-src (B01): http:/https: stay for the batch, health, and refine
         fetches; loopback WebSocket origins (any port) cover the default
         ws://127.0.0.1:8181/stream live-dictation URL and the browser
         preview's page-origin ws proxy. IPv6 loopback is reached through the
         `localhost` spelling the OS resolves to ::1 — bracketed IPv6 literals
         are not part of CSP's host-source grammar, so `ws://[::1]:*` sources
         are dropped by Chromium with a console error (QA round 1) and would
         never match. Non-loopback ws/wss endpoints are not statically
         enumerable, so the packaged app streams them over the native bridge
         in electron/streamBridge.ts instead of widening this policy. Keep in
         sync with src/connectPolicy.ts
         (STATIC_CONNECT_SRC, asserted by src/connectPolicy.test.ts). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' http: https: ws://127.0.0.1:* ws://localhost:* wss://127.0.0.1:* wss://localhost:*"
    />
    <title>Starling</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
