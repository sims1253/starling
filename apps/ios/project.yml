name: StarlingVoice
options:
  bundleIdPrefix: dev.starling
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  StarlingVoiceCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  StarlingVoice:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: StarlingVoiceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.starling.voice
        PRODUCT_NAME: Starling Voice
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets: []
