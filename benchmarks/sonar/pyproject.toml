[project]
name = "starling-sonar-bench"
version = "0.1.0"
description = "SONAR-OSS evaluation harness for Starling models / engines / quantizations"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Pin the version whose private registry and quality-model hooks the
    # harness patches; upgrades require reviewing those integration points.
    "psdn-sonar[ml]==0.1.2",
    "requests>=2.31.0",
    # Declare these directly so uv applies the CPU index to SONAR's ML stack.
    "torch",
    "torchaudio",
    "torchvision",
]

# This is a harness, not a package: uv builds a venv with the deps only and
# does not try to install this directory.
[tool.uv]
package = false

# This box has no NVIDIA GPU; SONAR only needs torch for the (CPU) audio-quality
# and semantic-similarity models. Pull the CPU wheels instead of the ~2.5 GB
# CUDA default so the venv stays small.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
