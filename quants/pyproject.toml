[project]
name = "starling-quants"
version = "0.1.0"
description = "Reproducible Starling GGUF quantization recipes and artifact records"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
starling-quants = "starling_quants.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starling_quants"]

[tool.hatch.build.targets.wheel.force-include]
recipes = "starling_quants/recipes"
