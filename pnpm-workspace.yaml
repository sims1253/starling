packages:
  - apps/desktop
  - packages/*

# true = allowed to run install scripts; everything else stays unbuilt.
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true

# pnpm holds back releases younger than a day; list only locked versions that need it.
minimumReleaseAgeExclude:
  - lucide-react@1.46.0

catalog:
  '@types/node': 24.13.4
  effect: 4.0.0-rc.115
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
